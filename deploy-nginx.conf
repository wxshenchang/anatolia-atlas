server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json
               image/svg+xml application/xml text/xml;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    # 地形（固定文件名，换地形后必须让客户端尽快拿到新版）
    location ^~ /assets/terrain/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }
    location = /assets/terrain_relief.webp {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }
    location ~* \.(webp|png|jpg|jpeg|svg|woff2?|mp3|ogg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    # 代码（无 hash）也给短缓存，否则修了 bug 老访客拿不到新 app.js
    location ~* \.(js|css|json)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
